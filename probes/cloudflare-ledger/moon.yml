toolchains:
  default: [javascript, bun]
tasks:
  typecheck:
    command: bun --bun --no-env-file --no-install run typecheck
    options: { cache: false, retryCount: 0, envFile: false }
  test:
    command: bun --no-env-file --no-install tests/run.test.ts
    options: { cache: false, retryCount: 0, envFile: false }
