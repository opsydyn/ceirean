toolchains:
  default: [javascript, bun]
tasks:
  policy:
    command: bun --no-env-file --no-install test tests/policy.test.ts
    options: { cache: false, retryCount: 0, envFile: false }
  redact:
    command: bun --no-env-file --no-install test tests/redact.test.ts
    options: { cache: false, retryCount: 0, envFile: false }
  tools:
    command: bun --no-env-file --no-install test tests/tools.test.ts --timeout 25000
    options: { cache: false, retryCount: 0, envFile: false }
  agent:
    command: bun --no-env-file --no-install test tests/agent.test.ts --timeout 20000
    options: { cache: false, retryCount: 0, envFile: false }
  typecheck:
    command: bun --bun --no-env-file --no-install run typecheck
    options: { cache: false, retryCount: 0, envFile: false }
  test:
    command: bun --no-env-file --no-install test --timeout 25000
    options: { cache: false, retryCount: 0, envFile: false }
