toolchains:
  default: [javascript, bun]
tasks:
  domain:
    command: bun --no-env-file --no-install test tests/fixture.test.ts
    options: { cache: false, retryCount: 0, envFile: false }
  flue:
    command: bun --no-env-file --no-install test tests/flue.test.ts --timeout 15000
    options: { cache: false, retryCount: 0, envFile: false }
  restart:
    command: bun --no-env-file --no-install test tests/restart.test.ts --timeout 15000
    options: { cache: false, retryCount: 0, envFile: false }
  cancellation:
    command: bun --no-env-file --no-install test tests/cancellation.test.ts --timeout 15000
    options: { cache: false, retryCount: 0, envFile: false }
  report:
    command: bun --no-env-file --no-install test tests/report.test.ts
    options: { cache: false, retryCount: 0, envFile: false }
  typecheck:
    command: bun --bun --no-env-file --no-install run typecheck
    options: { cache: false, retryCount: 0, envFile: false }
  test:
    command: bun --no-env-file --no-install test --timeout 15000
    options: { cache: false, retryCount: 0, envFile: false }
