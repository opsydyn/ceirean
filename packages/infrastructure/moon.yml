toolchains:
  default: [javascript, bun, node]
tasks:
  typecheck:
    command: bun --bun --no-env-file --no-install run typecheck
    options: { cache: false, retryCount: 0, envFile: false }
  test:
    deps: ['~:operator-node-test']
    command: bun --no-env-file --no-install test --timeout 120000
    options: { cache: false, retryCount: 0, envFile: false }
  operator-node-test:
    command: node --test tests/readonly-operator-acquisition.test.ts
    options: { cache: false, retryCount: 0, envFile: false }
