name: Linux native filesystem integration

on:
  push:
    branches: [codex/native-fs-integration]

permissions: {}

jobs:
  native-filesystem:
    if: github.event.created == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch the exact public source revision
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet
          git fetch --no-tags --depth=1 https://github.com/opsydyn/ceirean.git "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Test the Linux amd64 filesystem boundary
        shell: bash
        env:
          CEIREAN_RUN_LINUX_FS_INTEGRATION: '1'
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = X64
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          uname -srmo
          cc --version
          timeout 60s sh probes/cloudflare-executor/scripts/test-linux-fs-boundary.sh
