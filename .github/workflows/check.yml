# The verification gate for this repository.
#
# Everything it runs already existed as a Moon task and has only ever run on a
# maintainer's laptop. That is the gap this closes: three evidence records
# reached `main` unformatted through pull request 4 because `oxfmt --check` was
# never executed anywhere a merge could see it.
#
# It runs the same targets as a local `moon run :typecheck :test`, through Moon
# rather than through open-coded `bun` invocations, so a green check here means
# the same thing a green run means on the laptop. Divergence between the two
# would make the gate a different, weaker claim than the one it appears to make.
#
# Third-party actions are pinned to commit SHAs, matching the convention the
# unpublished Linux cache qualification workflow already sets. The token is
# read-only: this job verifies, and has no business writing anything.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A superseded commit's result cannot gate anything, so stop paying for it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    # The suite is 4m19s on a 4-core laptop, dominated by property-based laws in
    # engine and migration-storage. Thirty minutes is headroom, not a target.
    timeout-minutes: 30
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # The version above is a literal, so it can drift from the toolchain pin.
      # Refuse rather than silently verify the candidate on another runtime.
      - name: Refuse a Bun that disagrees with the toolchain pin
        run: |
          pinned="$(sed -n 's/^bun = "=\(.*\)"$/\1/p' .prototools)"
          actual="$(bun --version)"
          if [ "$pinned" != "$actual" ]; then
            printf 'BLOCKED: .prototools pins bun %s, runner has %s\n' "$pinned" "$actual"
            exit 1
          fi
          printf 'bun %s matches the toolchain pin\n' "$actual"

      - name: Install dependencies from the committed lockfile
        run: bun install --frozen-lockfile

      - name: Install the pinned task runner
        run: npm install --global @moonrepo/cli@2.5.4

      - name: Lint and check formatting
        run: moon run workspace:check

      - name: Typecheck every project
        run: moon run :typecheck --concurrency 4

      - name: Run every test suite
        run: moon run :test --concurrency 4
